MEDIOLANUM-ES24.A(fund_assets):
  gather:
    fund: FUND_NAME
    currency: CURRENCY_STATEMENT
    date: ASSETS_DATE
    tot_assets: TOT_ASSETS
    liabilities: LIABILITIES
    net_assets: NET_ASSETS

# Il prospetto non nomina il suo comparto: il titolo sta una, due, tre o quattro pagine prima,
# perche' in mezzo ci stanno il commento di gestione e la tabella dei tre esercizi. Il comparto
# arriva quindi dalla pagina **piu' vicina che precede** fra quelle che ne hanno lasciato uno, e
# `fund_title` e' la pipeline che lo deposita — in uno step precedente dello `schedule`, o
# `filter_data` non porterebbe ancora niente.
UBS-EN23(fund_assets):
  gather:
    currency: CURRENCY_STATEMENT
    date: ASSETS_DATE
    tot_assets: TOT_ASSETS
    liabilities: LIABILITIES
    net_assets: NET_ASSETS
  fund:
    kind: nearest_page
    field: ubs-fund
    page_block_type: ASSETS_PAGE

# `A6`, gli indicatori ESG del modulo periodico. Due celle sole: **quale lettore** e **di chi e'
# questa pagina**; tutto il resto di un lettore ha il valore che le pagine misurate condividono.

# La sezione risponde in prosa: nessun numero, quindi nessun indicatore (`R11`) e la domanda di chi
# sia la pagina non si pone — per questo `fund` non c'e'.
ANIMA_SGR-IT24(esg_indicators):
  read:
    kind: leading_number

# La tabella non ha ne' serie ne' esercizi — un indicatore, un valore — quindi `series` e `column`
# valgono zero per tutte le celle e il lettore fa il solo lavoro che serve: tenere le celle che
# portano un numero. Il comparto e' quello che l'allegato ha depositato: un documento, un comparto.
EURIZON-IT24(esg_indicators):
  read:
    kind: dated_rows
  fund:
    kind: promise
    id: esg-indicator-fund

# L'indice di riferimento e' scritto con la stessa formula del comparto: `of the benchmark` e'
# l'unica cosa che le distingue, e il valore dell'indice non e' un dato del comparto. La stessa
# frase, al rovescio, sporca l'etichetta, e `strip` la toglie insieme al trattino dell'elenco.
UBS-EN23(esg_indicators):
  read:
    kind: labelled_pairs
    drop:
      - 'of the benchmark'
    strip:
      - '^o\s+'
      - '\s+of the financial product$'
  fund:
    kind: page_promise
    field: ubs-esg-fund

AMUNDI-EN24(esg_indicators):
  read:
    kind: dated_rows
  fund:
    kind: page_promise
    field: amundi-esg-fund

# Il valore in testa alla frase, il nome nel resto. La seconda voce dei sei comincia con la
# precisazione e non col numero, quindi cade: e' la regola applicata, non un difetto.
FINECO-EN23@IR(esg_indicators):
  read:
    kind: leading_number
  fund:
    kind: page_promise
    field: esg-fund

# `A7`, le ridenominazioni e le fusioni. Tre celle: quale lettore, i due elenchi di schemi, e quale
# dei due nomi deve essere un comparto del job (`current` per difetto, che e' `R24`).

# Una frase per evento, in italiano, coi tre gruppi nominati dentro lo schema.
ARCA-IT24(merges):
  read:
    kind: sentence
    merged:
      - '(?<when>[0-9]{1,2} [a-zàèéìòù]+ [0-9]{4}) (?:il|la) [Ff]ondo [“"](?<old>[^”"]+)[”"] è stato incorporato (?:nel|in) [Ff]ondo [“"](?<current>[^”"]+)[”"]'
    renamed:
      - '[Ii]l [Ff]ondo [“"](?<current>[^”"]+)[”"] \(già denominato (?<old>[^)]+)\) .{0,40}?(?<when>[0-9]{1,2} [a-zàèéìòù]+ [0-9]{4})'

DANSKEINVEST-EN24(merges):
  read:
    kind: sentence
    renamed:
      - '(?<old>Danske Invest SICAV\s*[-–]\s*[^.]+?) was renamed (?<current>[^.]+?) effective (?<when>\d{1,2} \w+ \d{4})'
    merged:
      - '(?<old>Danske Invest SICAV\s*[-–]\s*[^.]+?) merged into (?<current>[^.]+?) on (?<when>\d{1,2} \w+ \d{4})'
    strip:
      - '^Danske Invest SICAV\s*[-–]\s*'

# Un'intestazione datata apre un elenco, e le tre sezioni sorelle — lanciati, ridenominati,
# liquidati — restano fuori perche' una riga che non porta il connettore **chiude** lo scopo.
# Lo `strip` e' lo stesso prefisso che il modulo SFDR si toglie, e per la stessa ragione (`R24`).
AMUNDI-EN24(renaming):
  read:
    kind: listed
    renamed:
      - 'have been renamed'
    merged:
      - 'have been merged'
      - 'have been absorbed'
    strip:
      - '^Amundi Funds\s+'

MEDIOLANUM-EN24(fund_assets):
  date_regex: 'AS AT ([A-Z]+ [0-9]+, [0-9]+)'
  remove_from_fund: '\s*[*]*\s*$'
