# `A2`: un'intestazione apre una sezione
#
# Sei siti su sette, e differiscono **solo** nelle selezioni. Il settimo — FINECO-EN23@IR — resta
# d'autore perche' la sua sezione e' avvolta da una funzione che aggiunge il numero di pagina ai
# metadati di ogni blocco, e quello e' il punto di quel tubo (`P10`).
#
# `family` assente significa *la prossima riga con la stessa coppia (carattere, corpo)
# dell'intestazione*, che e' il difetto misurato e quello che a cinque siti su sei basta.

# `FC-5`: `Eventi rilevanti` e' una sezione che c'e', si apre e **dichiara l'assenza** — «Non si
# segnalano eventi rilevanti.» L'intestazione e' un parametro e non una costante (`R13`): ARCA
# scrive `Eventi rilevanti`, AMUNDI-IT24 `Eventi che hanno interessato il fondo`.
ARCA-IT24(merges):
  heading: 'lato-bold[11.5:12.5] "^Eventi rilevanti"'
  block_type: RELEVANT_BLOCK
  name: merges
  body: 'lato-regular[9.5:10.5]'

# `FC-3`: ogni evento e' una frase, col verbo e la data dentro. La sezione e'
# `NOTE 12 - EVENTS DURING THE YEAR` e si **ferma** alla nota che segue, `NOTE 13 - POST BALANCE
# SHEET EVENTS`: il bilancio chiude il 31 dicembre 2024 e la fusione di quella nota e' del
# 21 febbraio 2025, quindi appartiene all'esercizio dopo (`C36`). A chiuderla e' `family`, che qui
# e' la **stessa** selezione dell'intestazione: le intestazioni di nota sono le sole righe in
# `calibri-bold` da 9.
DANSKEINVEST-EN24(merges):
  heading: 'calibri-bold[8.5:9.5] "EVENTS DURING THE YEAR"'
  block_type: RELEVANT_BLOCK
  name: merges
  family: 'calibri-bold[8.5:9.5]'
  body: 'calibri[8.5:9.5]'

# `FC-1`, p510: tre sezioni una sotto l'altra con la **stessa** tipografia — comparti lanciati,
# ridenominati, liquidati — e solo la seconda porta un dato. L'intestazione **porta la data**
# (`on 15 March 2024`) e sotto ci sono ventun righe senza data, ma qui `include_heading` non serve:
# la data la ritrova il `text_filter`, che riceve la sezione intera.
AMUNDI-EN24(renaming):
  heading: 'arial-boldmt[9.0:10.0] "INTRODUCTION"'
  block_type: RELEVANT_BLOCK
  name: renaming
  body: 'arialmt[6.5:7.5]'

# `C16`, p4: le entrate dei gestori non si distinguono per tipografia — un nome, il suo elenco di
# comparti e il nome dopo sono lo stesso carattere — quindi le numera lo **stacco verticale**:
# quindici sta fra i 9,2 di una stessa entrata e i 18,4 fra due entrate. Il corpo si taglia per
# ascissa, e le righe di soli spazi si sottraggono: arrivando prima di quelle vere, diventerebbero
