            font: ['Lato,Bold', TrebuchetMS-Bold, 'Open Sans,Bold']
            text: 'Controvalore in '
          dx: 0.0
          dy: 1.0
          width: 1.2
          height: 1.2

# `C32`/`P8`: il nome del titolo va a capo, e chi decide quali righe sono una cella sola e' il
# `collapse` del tabularizzatore — qui con la direzione `up`. La colonna che puo' rompersi e' la
# **prima**, quella dei nomi.
#
# `C29`: a pagina 65 e 69 il titolo del comparto e' spezzato in **due** oggetti di testo sulla
# stessa ordinata (`Sidera Funds SICAV - ` e `Euro ESG Credit`), e senza `subfund_join` si
# prenderebbe la prima riga sola — cioe' mezzo nome, che fa nascere un fondo `SIDERA FUNDS SICAV` a
# cui restano appesi sette titoli di `SIDERA FUNDS SICAV EURO ESG CREDIT`.
CARNE-EN23(investments):
  body_set:
    font: ArialMT
    font_size: 6.96
    area:
      y_min: 160
      y_max: 786
  subfund_set:
    font: ArialMT
    font_size: [6.95, 6.97]
    window:
      anchor:
        font: ArialMT
        font_size: 6.96
        text: '^Annual report including'
      dx: 0.1
      dy: 0.8
      width: 2.0
      height: 1.4
  subfund_join: ' '
  currency_set:
    font: Arial-BoldMT
    text: Valuation in
  company_index: 1
  # La colonna che collassa e' quella dei nomi, che qui e' la **seconda** — `company_index: 1` — e
  # non la prima: il modulo d'autore chiedeva `collapse` senza nominare nessuna colonna, e in quel
  # caso il motore usa la colonna della societa'. Nominarla e' la stessa cosa detta per esteso;
  # scrivere `0` ne farebbe collassare **due**, e si perderebbe l'avviso di p42.
  collapse_cols: [1]
  collapse_direction: up

# ----------------------------------------------------------------------------------------------
# `grouped_lines`: una banda di righe, tagliata in entrate dallo stacco fra loro
# ----------------------------------------------------------------------------------------------
#
# Non e' una sezione: una sezione la apre un'**intestazione** e la chiude quella dopo, qui invece
# non c'e' nessuna intestazione — la banda la da' la selezione — e a separare un'entrata dall'altra
# c'e' solo la distanza verticale. Tre pipeline di tre formati scrivevano le stesse dodici righe di
# Python.

# I gestori stanno nella colonna di destra, uno per entrata, e ogni entrata e' su piu' righe: il
# nome, poi la frase fra parentesi che dice di quale comparto. Il numero dell'entrata viaggia nei
# metadati, perche' e' con quello che il `text_filter` rimette insieme le righe di un gestore.
FINECO-EN23@LUX(inv_managers):
  - selection:
      font: arialnarrow
      font_size: [10.9, 11.1]
      area:
        x_min: 315
    block_type: INV_MAN
    name: inv managers
    gap: 20.0
  # La societa' di gestione sta sulla stessa pagina, sotto la sua etichetta: la finestra prende la
  # riga sotto, larga quasi il doppio dell'etichetta.
  - label:
      window:
        anchor:
          font: arialnarrow-bold
          font_size: [10.9, 11.1]
          text: 'Management Company and Global Distributor '
        dx: -0.2
        dy: 1.2
        width: 1.8
        height: 1.3
    block_type: MANAGEMENT_COMPANY
    name: managment company

# Gli eventi stanno fra due intestazioni, e ogni fusione e' un'entrata di piu' righe che va
