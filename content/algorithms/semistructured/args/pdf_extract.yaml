# Il segno e' una `X` di testo in Arial-BoldMT su tutti e quattro i moduli. Il nome del
# prodotto sta sotto l'etichetta, non accanto, e va a capo sulla qualificazione.
#
# L'ombrello, pero', lo stesso documento lo scrive in due modi: `Sidera Funds SICAV -
# Christian Equity` su una pagina e `Sidera Funds - Digital Worlds` sulle altre tre, mentre
# il portafoglio lo scrive sempre `SIDERA FUNDS SICAV`. Per `R24` non basta toglierlo: va
# tolto **e riscritto**, ed e' per questo che qui convivono una rimozione e un
# `product_prepend`.
#
# Una delle quattro righe si perde lo stesso, e non per colpa del modulo: il portafoglio
# intitola due comparti `... CHRISTIAN EQUITY*` e `... FINANCIAL BOND*`, col richiamo di
# nota attaccato che `R16` vorrebbe via. Finche' e' li', il nome del modulo non puo'
# corrispondere.
CARNE-EN23(sfdr_classification):
  language: ENGLISH
  product_joined: true
  product_prepend: "SIDERA FUNDS SICAV"

# Il segno e' un'immagine, e il modulo e' quello italiano. Il nome del prodotto pero' non e'
# scritto come lo scrivono gli investimenti: il portafoglio intitola i comparti
# `Fondo Mediolanum ...`, il modulo `Mediolanum ...`. Senza rimettere davanti la parola che
# manca, `R24` non regge e le due righe si perdono in silenzio.
MEDIOLANUM-IT24.B(sfdr_classification):
  language: ITALIAN
  product_joined: true
  product_prepend: "FONDO"

# Tre impaginazioni nello stesso documento -- il segno e' un'immagine su ventotto moduli, una `X` di
# testo su sei e un glifo `funddsymbol` su uno -- e il modello le legge tutt'e tre senza che il
# formato scelga.
#
# Il nome del prodotto **va a capo**, quindi serve la lettura a colonna. Prima questo formato aveva
# un tubo scritto a mano con il bordo destro della colonna fisso a `x1=372.94`, misurato su un nome
# corto: a pagina 975 `FINECO AM EUROPEAN CORPORATE BOND FAM FUND` arriva a `x=391` e cadeva fuori,
# quindi il blocco usciva con la sola etichetta e l'articolo si perdeva in silenzio. E' la voce
# `C33`. La lettura a colonna del motore non ha un bordo fisso: chiude la colonna
# sull'**identificativo della persona giuridica**, che su questo modulo sta *sotto* l'etichetta e
# quindi chiude il blocco invece di stringerlo.
FINECO-EN23@IR(sfdr_classification):
  language: ENGLISH
  product_joined: true
