KAIROS-EN23(manco):
  label: 'window(arialnarrow-bold "Management Company", -0.1, 0.5, 10.0, 1.8) / "^ $"'
  block_type: MANAGEMENT_COMPANY
  name: managment company

# Il primo dei due tubi di questa pipeline: l'altro — la sezione dei gestori — resta d'autore, e
