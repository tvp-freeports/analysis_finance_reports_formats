# La societa' di gestione sta sotto l'etichetta `Società di gestione:`, e quello che si consegna al
# `text_filter` e' una **finestra costruita attorno al valore** e non l'etichetta: e' il caso per cui
# `window(ancora, dx, dy, larghezza, altezza)` esiste — la scatola della riga dell'ancora, spostata
# di un'altezza e mezza in giu' e allargata cento volte.
FIDEURAM-IT24(manco):
  label: 'window(arial[9.9:10.1] "Società di gestione:", -0.2, 1.5, 100.0, 1.2)'
  block_type: MANAGEMENT_COMPANY
  name: managment company

# L'etichetta e' `Manager, Promoter and Distributor` — la virgola dentro l'ancora e' al sicuro,
# perche' i quattro numeri di `window` si leggono **da destra** — e la finestra prende la riga sotto.
ANIMA-EN23(manco):
  label: 'window(helvetica-bold "Manager, Promoter and Distributor", -0.1, 1.0, 1.3, 1.5)'
  block_type: MANAGEMENT_COMPANY
  name: managment company

# La finestra sotto `Management Company` prenderebbe anche la colonna di destra: a chiuderla e'
# l'**ascissa** del titolo che le sta accanto, `Legal adviser`, intersecata con la finestra. Un lato
# d'area che e' una riga della pagina prende il suo bordo **interno**, quindi il limite cade fra le
# due colonne e non sopra la seconda.
CARNE-EN23(manco):
  label: '((:<arial-boldmt[7.9:8.1] "Legal adviser">)(:)) window(arial-boldmt[7.9:8.1] "Management Company", -0.1, 0.8, 100, 2.5)'
  block_type: MANAGEMENT_COMPANY
  name: managment company

# La banda sotto l'etichetta porta anche le righe di soli spazi che il generatore lascia fra una
