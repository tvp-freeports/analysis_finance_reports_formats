      width: 1.2
      height: 1.2

# Il portafoglio di MEDIOLANUM-ES24.A, che non nomina **nessun** carattere.
#
# Il documento e' composto in una famiglia che la configurazione non ha ragione di sapere: le tre
# selezioni dicono *lo stesso carattere della testata della colonna* — `Descripcion de la cartera`
# — e `font_of` e' quel *lo stesso*. Scrivere la famiglia qui vorrebbe dire legare il formato a una
# composizione di un documento, che e' l'opposto di quello che un'ancora deve fare.
#
# L'ancora e' `n de la cartera` e non la testata intera perche' la `o` di `Descripcion` porta
# l'accento e il PDF lo codifica in due modi; il pezzo di coda e' comune a tutt'e due.
#
# Il corpo si ferma a 767 — il piede della pagina — e scarta le righe di soli spazi; il comparto sta
# nella testatina fra 58 e 82; la valuta e' la riga `(expresado en ...)` da nove punti. Le tre
# grafie sono state confrontate con quelle del modulo d'autore **su tutte le 57 pagine del report
# di prova**, con zero differenze.
MEDIOLANUM-ES24.A(investments):
  body_set:
    area:
      y_max: 767.0
    font_of:
      text: n de la cartera
    without:
      - text: '^ '
  subfund_set:
    area:
      y_min: 58.0
      y_max: 82.0
    font_of:
      text: n de la cartera
  currency_set:
    font_size: [8.9, 9.1]
    text: '(expresado en'
    font_of:
      text: n de la cartera

# `FA-4`: due comparti per pagina, ognuno con la colonna del periodo corrente e quella di dicembre,
# e le tre righe dei **totali** stampate come **un solo oggetto** che porta tutti e quattro i
# numeri (sul netto, tre oggetti con uno, uno e due). Non c'e' un'ascissa per valore, quindi gli
# importi non si possono abbinare per colonna come fa la tabella structured: si separano sulle
# corse di spazi (`values_in_one_line`) e se ne prende uno ogni due (`value_step`), in ordine.
MEDIOLANUM-EN24(fund_assets):
  fund_set:
    window:
      anchor: {text: '(expressed in'}
      dx: 1.2
      dy: -0.1
      width: 100.0
      height: 3.4
    without:
      - text: '^Jun '
      - text: '^Dec '
  currency_set: {text: '(expressed in'}
  date_set: {font_size: 12, text: AS AT}
  tot_assets: {anchor: {text: TOTAL ASSETS}}
  liabilities: {anchor: {text: Redeemable Participating Units}}
  net_assets: {anchor: {text: REDEEMABLE PARTICIPATING UNITS}}
  value_step: 2
  values_in_one_line: true
