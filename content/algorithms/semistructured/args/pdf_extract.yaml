# solo la posizione distingue i due. Lasciato aperto, la sua griglia di colonne molto piu' fitta
# viene tabularizzata insieme ai titoli e spinge ogni campo di ogni titolo fuori dalla colonna.
#
# Il comparto sta fra la riga della societa' di gestione e l'intestazione della tabella: i due lati
# dell'area sono due righe della pagina.
#
# La valuta e' scritta in due modi nello stesso formato — `Controvalore in euro` su una riga sola, o
# `Controvalore in` e la valuta sulla riga sotto — quindi la selezione e' l'**unione** dei due casi,
# e dal primo si sottrae `in $` perche' quella e' la colonna del controvalore in dollari.
ANIMA_SGR-IT24(investments):
  body_set:
    font: [Lato, TrebuchetMS, Open Sans]
    font_size: [6.8, 7.2]
    area:
      y_min:
        font: [Lato, TrebuchetMS, Open Sans]
        font_size: [11, 13]
        text: Elenco analitico
      y_max:
        font: [Lato, TrebuchetMS, Open Sans]
        font_size: [11, 13]
        text: Ripartizione degli strumenti finanziari
