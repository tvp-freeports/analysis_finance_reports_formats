# ----------------------------------------------------------------------------------------------
# `A1`: un'etichetta dichiara un valore li' accanto
#
# Le etichette si scrivono nella grammatica compatta — la stessa delle celle del livello
# strutturato — perche' un'etichetta non e' quasi mai un criterio solo: e' un carattere (spesso
# un'**unione** di famiglie, `R8`), un corpo, e un testo ancorato. Il testo va **fra apici**:
# senza, la grammatica legge un nome di carattere, e un carattere che nessuno ha non seleziona
# niente. Una cella che la grammatica non legge per intero viene rifiutata, perche' altrimenti
# selezionerebbe ogni riga della pagina.

# `IM-1` e `MC-1`: pagina 3 mette le due etichette in due colonne e sotto ciascuna il nome, poi
# l'indirizzo. Le etichette sono le **sole** righe in grassetto da 9.98 — il titolo della pagina e'
# 13.97 e i nomi sono in tondo — quindi il corpo le identifica esattamente, e `below` col
# collocamento per difetto prende la prima riga sotto, che e' il nome e non l'indirizzo.
#
# ASTERIA-EN24 scrive la pagina **identica** a due anni di distanza: stesse etichette, stesso corpo.
ASTERIA-EN23(inv_managers):
  - label:
      font: centurygothic-bold
      font_size: [9.5, 10.5]
      text: '^Management Company:'
    block_type: MANAGEMENT_COMPANY
    name: managment company
    where: below
  - label:
      font: centurygothic-bold
      font_size: [9.5, 10.5]
      text: '^Investment Manager and Global Distributor:'
    block_type: INVESTMENTS_MANAGER
    name: investments managers
    where: below

ASTERIA-EN24(inv_managers):
  - label:
      font: centurygothic-bold
      font_size: [9.5, 10.5]
      text: '^Management Company:'
    block_type: MANAGEMENT_COMPANY
    name: managment company
    where: below
  - label:
      font: centurygothic-bold
      font_size: [9.5, 10.5]
      text: '^Investment Manager and Global Distributor:'
    block_type: INVESTMENTS_MANAGER
    name: investments managers
    where: below

# `C07` e `C19`: **nessuna delle due etichette e' quella consueta**, perche' il bilancio e' di un
