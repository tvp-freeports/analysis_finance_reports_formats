# ----------------------------------------------------------------------------------------------
# Il numero di pagina stampato, e i due prospetti che aspettavano lui
# ----------------------------------------------------------------------------------------------
#
# `P10`. Quello che teneva questi tubi in Python non era la regola — *l'ultima riga in basso che sia
# cifre* — ma la **selezione**: il documento e' impaginato come un libro e il numero sta a sinistra
# sulle pagine pari e a destra sulle dispari, cioe' in **un'unione di due aree**. Nella grammatica
# compatta l'unione esiste solo per i caratteri (`R8`); la forma a mappa adesso ha `any_of`, ed e'
# questo che l'ha chiesta.

# Il prospetto patrimoniale di UBS-EN23, che era l'**ultimo** degli otto restato Python — e ci
# restava per l'ordine: il tubo del numero di pagina e' il **primo** della pipeline, e un tubo
# promosso arriva prima di quelli d'autore, quindi finche' il numero di pagina non si leggeva da
# configurazione nessuno degli altri cinque poteva passare.
#
# Il comparto non sta su questa pagina: lo porta il titolo della pagina **piu' vicina che precede**,
# e il blocco `ASSETS_PAGE` e' la chiave con cui il `text_filter` lo ritrova (`fund: nearest_page`).
UBS-EN23(fund_assets):
  - selection:
      font: frutiger45light
      font_size: [6.5, 7.5]
      any_of:
        - area:
            x_max: 200
            y_min: 785
        - area:
            x_min: 450
            y_min: 785
    block_type: ASSETS_PAGE
    name: assets page
  # La valuta non ha etichetta: sta nella banda fra il titolo del prospetto e la riga `Assets`,
  # sulla colonna dei valori. E' geometria, e i due lati sono due righe della pagina.
  - selection:
      font: frutiger45lightbold
      font_size: [6.5, 7.5]
      area:
        x_min: 450
        y_min:
          font: frutiger45lightbold
          font_size: [9.5, 10.5]
          text: '^Statement of Net Assets'
        y_max:
          font: frutiger45lightbold
          font_size: [6.5, 7.5]
          text: '^Assets'
  # `R17`: la data si prende dalla colonna, che qui e' la riga dell'etichetta `Assets`. Il valore si
  # cerca **da quella riga in giu'**: la riga sopra porta la valuta alla stessa ascissa e la banda
  # che `right` apre sulla scatola dell'etichetta la sfiora — misurato, la data sta a 132,4 e `EUR`
  # a 123,4, e senza questo vincolo la data diventa `EUR`.
  - label:
      font: frutiger45lightbold
      font_size: [6.5, 7.5]
      text: '^Assets'
    block_type: ASSETS_DATE
    name: assets date
    where: right
    value:
      area:
        x_min: 460
      without:
        - area:
            y_max:
              font: frutiger45lightbold
              font_size: [6.5, 7.5]
              text: '^Assets'
  # La colonna dei valori comincia oltre 460: fra l'etichetta e il valore la riga porta un blocco
  # vuoto a 449,7, e senza questo vincolo `right` prenderebbe quello.
  - label:
      font: frutiger45lightbold
      font_size: [6.5, 7.5]
      text: '^Total Assets'
    block_type: TOT_ASSETS
    name: tot_assets
    where: right
    value:
      area:
        x_min: 460
  - label:
      font: frutiger45lightbold
      font_size: [6.5, 7.5]
      text: '^Total Liabilities'
    block_type: LIABILITIES
    name: liabilities
    where: right
    value:
      area:
        x_min: 460
  - label:
      font: frutiger45lightbold
      font_size: [6.5, 7.5]
      text: '^Net assets at the end of the financial year'
    block_type: NET_ASSETS
    name: net_assets
    where: right
    value:
      area:
        x_min: 460

