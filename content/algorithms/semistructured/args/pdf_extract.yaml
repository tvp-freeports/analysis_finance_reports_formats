  gap: 20.0
  join: ''
  take: first

# Il comparto sta fra il titolo del prospetto e `Domicile`, e la valuta nella riga **sotto**
# `Fair Value`: una finestra alta e larga una volta e un quinto l'ancora.
#
# Il corpo e' chiuso sopra da un'ordinata e sotto da **due** cose insieme: il titolo della sezione
# che segue la tabella — che e' uno di tre, quindi un'unione — e un'ordinata che tiene fuori il
# piede di pagina dove quel titolo non c'e'. Due limiti sulla stessa coordinata non stanno in una
