# ----------------------------------------------------------------------------------------------
# I prospetti patrimoniali: `fund`, `currency_constant` e le etichette di `A1`
#
# Il `pdf_extract` di un prospetto si sposta **tutto insieme**, e non un tubo per volta: i tre
# livelli si sommano per lo stesso nome di pipeline e un tubo del `semistructured` arriva **prima**
# di quelli d'autore, quindi spostarne uno e lasciare i vicini in Python cambierebbe l'ordine dei
# blocchi della pagina — che e' cio' che le fixture congelano.
#
# Una cosa da sapere sulle aree: un lato scritto `0` viene **rifiutato** (`InputArea::build` valida
# positivo ogni lato che riceve), mentre un lato **vuoto** e' quello aperto. Quindi
# `PdfLineSelection.area(0.0, 0.0, 370.0, 1e6)` si scrive `((:370)(:))`.

# `FA-2` e `FA-3`: ventisette comparti, ventisette coppie di pagine. La difficolta' non e'
# l'appaiamento ma `R5`, cioe' **quale** colonna di numeri sia l'esercizio corrente. Due comparti su
# ventisette sono nati nell'esercizio e la colonna di prima non ce l'hanno: la pagina non la lascia
# vuota, la **toglie**, e il valore corrente si stampa dove sulle altre sta il precedente — sul
# passivo i due posti coincidono (`504,6-533,9` contro `508,8-533,9`), quindi nessuna ascissa fissa
# li distingue, e nemmeno la distanza dall'etichetta (ventun righe contro trentatre).
#
# Cio' che li distingue e' l'**intestazione**: `Situazione a fine esercizio precedente` c'e' solo
# dove la colonna c'e', e il suo margine sinistro e' il limite destro dell'esercizio corrente; dove
# non c'e', la selezione non trova niente e il limite resta aperto, che e' la lettura giusta perche'
# non c'e' nessuna colonna da cui difendersi. Resta una sottrazione sola: le percentuali portano la
# virgola decimale e gli importi no.
AMUNDI-IT24(fund_assets_begin):
  - selection: 'Arial-BoldItalicMT[9.9:10.1] ((:)(40:60))'
  - currency: EUR
  - label: 'TrebuchetMS-Bold[6.9:7.0] "^TOTALE ATTIVITÀ"'
    block_type: TOT_ASSETS
    name: tot_assets
    where: right
    value: '((:<"^Situazione a fine">)(:)) / ","'

AMUNDI-IT24(fund_assets_end):
  - selection: 'Arial-BoldItalicMT[9.9:10.1] ((:)(40:60))'
  - currency: EUR
  - label: 'TrebuchetMS[6.9:7.0] "^Situazione al"'
    block_type: ASSETS_DATE
    name: assets date
    where: below
  - label: 'TrebuchetMS-Bold[6.9:7.0] "^TOTALE PASSIVITÀ"'
    block_type: LIABILITIES
    name: liabilities
    where: right
    value: '((:<"^Situazione a fine">)(:)) / ","'
  - label: 'TrebuchetMS[6.9:7.0] "^VALORE COMPLESSIVO NETTO DEL FONDO"'
    block_type: NET_ASSETS
    name: net_assets
    where: right
    value: '((:<"^Situazione a fine">)(:)) / ","'

# `FA-2` e `FA-3`: `SITUAZIONE PATRIMONIALE` apre l'attivo su una pagina e continua col passivo e il
# netto su quella dopo, e `FundAssets` vuole i tre importi insieme (`R32`), quindi nessuna delle due
# pagine da sola costruisce la riga — il totale delle attivita' attraversa il confine come promessa.
#
# `R5`: le due pagine mettono la colonna corrente in **due posti diversi**, e sulla pagina
# dell'attivo fra le due colonne di valori ce n'e' una di percentuali. Nessuna delle tre si separa
# con un'ancora testuale, perche' portano tutte soltanto cifre: le ascisse sono misurate su tutt'e
# due i documenti di prova, che concordano — sull'attivo il valore sta fra 310 e 353 e la percentuale
# comincia a 384, sul passivo il valore sta fra 407 e 451 e l'esercizio precedente comincia a 458.
#
# `CLASSE P` e `CLASSE R` cominciano con le stesse parole del netto del fondo: sono il netto delle
# **classi di quote**, e si **sottraggono**. Non ci si affida al fatto che il netto del fondo venga
# per primo, perche' le righe di una pagina non arrivano in ordine di lettura e `take: first` sceglie
# la prima dell'elenco, non la piu' in alto.
#
# `R17`: la data si prende dalla colonna, sotto `Situazione al` e alla stessa ascissa; la copertina
# la scrive dentro il titolo del prospetto, che e' la fonte meno diretta.
ARCA-IT24(fund_assets_begin):
