      text: "^ "
  body_set:
    font: TrebuchetMS
  subfund_set:
    font: Arial-BoldItalicMT
    area:
      y_max: 60
  currency: EUR
  # 0.5 on both axes, which is what this format has always had: of the two keys the old schema
  # accepted the engine passed only one to the tabularizer, and that one value served columns and
  # rows together. The two axes are separate now and neither stands in for the other, so the value
  # that was implicit is written twice.
  col_tolerance: 0.5
  row_tolerance: 0.5
  # `C31` resta aperta, e adesso si sa quanto costa. Su p446 la maturita' di
  # `CATERPILLAR FINANCIAL SERVICES 0.8% 13-11-` va a capo e il `25` finisce da solo nella colonna
  # dei nomi: `collapse_cols: [0]` la ricompone — la cella c'e' e il `collapse` la chiude — ma su
  # ventisette prospetti costa **tredici righe** di `investments.csv`, perche' qui le celle che la
  # geometria dice rotte sono spesso due investimenti di fila. E' il caso di cui hai detto «se per
  # fare questo si rompe l'algoritmo, si puo' tenere cosi'».

FIDEURAM-IT24(investments):
